<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Swag Labs - Mock Store</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f7f9fa; }
        header { background: #2f3640; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .app_logo { font-size: 22px; font-weight: bold; }
        .shopping_cart_link { position: relative; color: white; text-decoration: none; font-size: 18px; cursor: pointer; }
        .shopping_cart_badge { background: #e84118; color: white; border-radius: 50%; padding: 2px 7px; font-size: 12px; margin-left: 5px; }
        .container { max-width: 900px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .login-box { max-width: 350px; margin: 60px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #dcdde1; border-radius: 4px; box-sizing: border-box; }
        button, .btn_inventory, .btn_action { background: #4cd137; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #44bd32; }
        .inventory_item { border-bottom: 1px solid #f1f2f6; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .inventory_item_name { font-size: 18px; font-weight: bold; color: #273c75; cursor: pointer; }
        .inventory_item_price { color: #44bd32; font-size: 16px; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<header id="header" class="hidden">
    <div class="app_logo">Swag Labs Mock</div>
    <div style="display:flex; align-items:center; gap: 20px;">
        <input type="text" id="search-box" placeholder="Search products..." style="padding:6px; border-radius:4px;" onkeyup="filterProducts()">
        <a class="shopping_cart_link" onclick="showCart()">Cart <span class="shopping_cart_badge" id="cart-badge">0</span></a>
    </div>
</header>

<div class="login-box" id="login-container">
    <h2>Sign In</h2>
    <input type="text" id="user-name" placeholder="Username (standard_user)">
    <input type="password" id="password" placeholder="Password (secret_sauce)">
    <button id="login-button" onclick="performLogin()">Login</button>
    <div id="login-error" style="color:red; margin-top:10px;"></div>
</div>

<div class="container hidden" id="inventory-container">
    <h2>Products</h2>
    <div class="inventory_list" id="inventory-list">
        <div class="inventory_item" data-title="Sauce Labs Backpack">
            <div>
                <div class="inventory_item_name" onclick="selectProduct('Sauce Labs Backpack', '$29.99')">Sauce Labs Backpack</div>
                <div class="inventory_item_desc">Carry all the things with the sleek, streamlined Sly Pack.</div>
                <div class="inventory_item_price">$29.99</div>
            </div>
            <button class="btn_inventory" onclick="addToCart('Sauce Labs Backpack')">Add to cart</button>
        </div>
        <div class="inventory_item" data-title="Sauce Labs Bike Light">
            <div>
                <div class="inventory_item_name" onclick="selectProduct('Sauce Labs Bike Light', '$9.99')">Sauce Labs Bike Light</div>
                <div class="inventory_item_desc">A red light with 1,000 lumens of light.</div>
                <div class="inventory_item_price">$9.99</div>
            </div>
            <button class="btn_inventory" onclick="addToCart('Sauce Labs Bike Light')">Add to cart</button>
        </div>
        <div class="inventory_item" data-title="Sauce Labs Bolt T-Shirt">
            <div>
                <div class="inventory_item_name" onclick="selectProduct('Sauce Labs Bolt T-Shirt', '$15.99')">Sauce Labs Bolt T-Shirt</div>
                <div class="inventory_item_desc">Get your shirt on! 100% preshrunk cotton.</div>
                <div class="inventory_item_price">$15.99</div>
            </div>
            <button class="btn_inventory" onclick="addToCart('Sauce Labs Bolt T-Shirt')">Add to cart</button>
        </div>
    </div>
</div>

<div class="container hidden" id="detail-container">
    <button onclick="backToCatalog()" style="background:#718093; margin-bottom:15px;">&larr; Back to products</button>
    <h2 id="detail-title" class="inventory_item_name"></h2>
    <p id="detail-price" class="inventory_item_price"></p>
    <button class="btn_inventory" id="detail-add-btn" onclick="addToCartFromDetail()">Add to cart</button>
</div>

<div class="container hidden" id="cart-container">
    <h2>Your Shopping Cart</h2>
    <button onclick="backToCatalog()" style="background:#718093; margin-bottom:15px;">&larr; Continue Shopping</button>
    <div id="cart-items-list"></div>
</div>

<script>
    let cartItems = [];
    let selectedItem = null;

    function performLogin() {
        const u = document.getElementById('user-name').value;
        const p = document.getElementById('password').value;
        if (u === 'standard_user' && p === 'secret_sauce') {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('header').classList.remove('hidden');
            document.getElementById('inventory-container').classList.remove('hidden');
        } else {
            document.getElementById('login-error').innerText = 'Epic sadface: Username and password do not match';
        }
    }

    function filterProducts() {
        const q = document.getElementById('search-box').value.toLowerCase();
        const items = document.querySelectorAll('.inventory_item');
        items.forEach(it => {
            const title = it.getAttribute('data-title').toLowerCase();
            it.style.display = title.includes(q) ? 'flex' : 'none';
        });
    }

    function selectProduct(name, price) {
        selectedItem = { name, price };
        document.getElementById('inventory-container').classList.add('hidden');
        document.getElementById('detail-container').classList.remove('hidden');
        document.getElementById('detail-title').innerText = name;
        document.getElementById('detail-price').innerText = price;
    }

    function backToCatalog() {
        document.getElementById('detail-container').classList.add('hidden');
        document.getElementById('cart-container').classList.add('hidden');
        document.getElementById('inventory-container').classList.remove('hidden');
    }

    function addToCart(title) {
        cartItems.push(title);
        updateCartBadge();
    }

    function addToCartFromDetail() {
        if (selectedItem) {
            addToCart(selectedItem.name);
        }
    }

    function updateCartBadge() {
        document.getElementById('cart-badge').innerText = cartItems.length;
    }

    function showCart() {
        document.getElementById('inventory-container').classList.add('hidden');
        document.getElementById('detail-container').classList.add('hidden');
        const cartView = document.getElementById('cart-container');
        cartView.classList.remove('hidden');

        const list = document.getElementById('cart-items-list');
        list.innerHTML = '';
        if (cartItems.length === 0) {
            list.innerHTML = '<p class="cart_empty">Your cart is empty.</p>';
            return;
        }
        cartItems.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'inventory_item';
            div.innerHTML = `<span class="inventory_item_name">${item}</span>
                             <button class="cart_button" style="background:#e84118;" onclick="removeItem(${index})">Remove</button>`;
            list.appendChild(div);
        });
    }

    function removeItem(idx) {
        cartItems.splice(idx, 1);
        updateCartBadge();
        showCart();
    }
</script>
</body>
</html>
